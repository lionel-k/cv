name: Compile PDFs

on:
  push: {}
  pull_request: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Compile
      run: make && make pafen

    - uses: actions/upload-artifact@v4
      with:
        name: senior-software-engineer-cvs
        path: |
          variants/senior-software-engineer/*.pdf
          variants/senior-software-engineer-fr/*.pdf
          variants/pafen/*.pdf

    - name: Commit PDFs on main
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add variants/senior-software-engineer/senior-software-engineer.pdf
        git add variants/senior-software-engineer-fr/senior-software-engineer-fr.pdf
        git add -f variants/pafen/pafen.pdf
        git diff --staged --quiet || git commit -m "chore: regenerate CV PDFs"
        git push
