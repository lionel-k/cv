name: Compile PDFs

on:
  push: {}
  pull_request: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Compile
      run: make && make pafen

    - uses: actions/upload-artifact@v4
      with:
        name: senior-software-engineer-cvs
        path: |
          variants/senior-software-engineer/*.pdf
          variants/senior-software-engineer-fr/*.pdf
          variants/pafen/*.pdf

    - name: Commit PDFs on main
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add variants/senior-software-engineer/senior-software-engineer.pdf
        git add variants/senior-software-engineer-fr/senior-software-engineer-fr.pdf
        git add -f variants/pafen/pafen.pdf
        git diff --staged --quiet || git commit -m "chore: regenerate CV PDFs"
        git push

        # Tags déplacés → jsDelivr sert application/pdf (affichage navigateur), sans cache @main
        git tag -f sse-en-latest
        git tag -f sse-fr-latest
        git tag -f pafen-latest
        git push -f origin sse-en-latest sse-fr-latest pafen-latest

        for path in \
          variants/senior-software-engineer/senior-software-engineer.pdf \
          variants/senior-software-engineer-fr/senior-software-engineer-fr.pdf \
          variants/pafen/pafen.pdf; do
          tag=""
          case "$path" in
            *senior-software-engineer/senior-software-engineer.pdf) tag="sse-en-latest" ;;
            *senior-software-engineer-fr/*) tag="sse-fr-latest" ;;
            *pafen/*) tag="pafen-latest" ;;
          esac
          curl -fsS "https://purge.jsdelivr.net/gh/lionel-k/cv@${tag}/${path}" || true
        done

        SHA=$(git rev-parse HEAD)
        echo "PAFEN: https://cdn.jsdelivr.net/gh/lionel-k/cv@pafen-latest/variants/pafen/pafen.pdf (@${SHA})" >> "$GITHUB_STEP_SUMMARY"
